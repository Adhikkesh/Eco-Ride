name: eco_ride_mobile
description: Eco-Ride Flutter Mobile Application - Sustainable ride-sharing for a greener future.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.2.2
  firebase_storage: ^12.3.0
  http: ^1.2.0
  file_picker: ^8.1.0
  intl: ^0.19.0
  
  # UI & Styling
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  
  # Maps & Location
  google_maps_flutter: ^2.5.3
  location: ^6.0.2
  firebase_database: ^11.3.10
  flutter_stripe: ^12.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  # Optional: Add custom assets here later
  # assets:
  #   - assets/images/
