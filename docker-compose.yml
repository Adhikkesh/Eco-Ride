services:
  # ── Eco-Ride Backend Server (Express API) ───────────────
  server:
    build:
      context: .
      dockerfile: apps/backend/server/Dockerfile
    container_name: eco-ride-server
    env_file:
      - .env.docker
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - ./apps/backend/server/firebase_credential.json:/app/firebase_credential.json:ro
    depends_on:
      - prediction
    restart: unless-stopped

  # ── Eco-Ride Driver Simulator ───────────────────────────
  simulator:
    build:
      context: .
      dockerfile: apps/backend/simulator/Dockerfile
    container_name: eco-ride-simulator
    env_file:
      - .env.docker
    volumes:
      - ./apps/backend/server/firebase_credential.json:/app/firebase_credential.json:ro
    depends_on:
      - server
    restart: unless-stopped

  # ── LSTM Demand Prediction Service (Python) ─────────────
  prediction:
    build:
      context: .
      dockerfile: apps/backend/prediction-service/Dockerfile
    container_name: eco-ride-prediction
    ports:
      - "5000:5000"
    environment:
      - MODEL_PATH=model/global_ecoride_lstm.h5
      - PORT=5000
    restart: unless-stopped
